version: '3.9'

services:
  # Primary Database for User Data, Server Inventory, Configuration
  postgres:
    image: postgres:16-alpine
    container_name: aegis_postgres
    restart: always
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_password
      POSTGRES_DB: aegis_core
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aegis_net

  # High-Performance OLAP DB for Logs, Metrics, Traces
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: aegis_clickhouse
    restart: always
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - aegis_net

  # UI for Clickhouse (Optional, good for debugging)
  clickhouse-ui:
    image: spoonest/clickhouse-tabix-web-client
    ports:
      - "8080:80"
    networks:
      - aegis_net
    depends_on:
      - clickhouse

networks:
  aegis_net:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:
